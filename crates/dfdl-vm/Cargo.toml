[package]
name = "dfdl-vm"
version = "0.1.0"
edition = "2021"
authors = ["DFDL Engine Developers"]
description = "Deterministic no_std bytecode virtual machine and execution engine for DFDL binary telemetry decoding"
license = "MIT OR Apache-2.0"

[features]
default = []
std = []

[dependencies]
dfdl-core = { path = "../dfdl-core", default-features = false }
dfdl-schema = { path = "../dfdl-schema", default-features = false }

[lints]
workspace = true
