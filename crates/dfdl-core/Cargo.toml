[package]
name = "dfdl-core"
version = "0.1.0"
edition = "2021"
authors = ["DFDL Engine Developers"]
description = "Core DFDL engine vocabulary, types, panic-free utilities, and execution kernel"
license = "MIT OR Apache-2.0"

[features]
default = []
std = []

[dependencies]
pest = { version = "2.7", default-features = false }
pest_derive = { version = "2.7", default-features = false }
regex = { version = "1.10", default-features = false, features = ["unicode-perl", "unicode-case", "unicode-gencat"] }
xmlparser = { version = "0.13", default-features = false }

[lints]
workspace = true
