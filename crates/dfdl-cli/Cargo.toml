[package]
name = "dfdl-cli"
version = "0.1.0"
edition = "2021"
authors = ["DFDL Engine Developers"]
description = "Command-line interface wrapper for DFDL engine"
license = "MIT OR Apache-2.0"

[dependencies]
dfdl-core = { path = "../dfdl-core", features = ["std"] }
